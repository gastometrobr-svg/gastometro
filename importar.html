<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Importar Dados — GastôMetro</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:system-ui,sans-serif;background:#f1f5f9;color:#0f172a;padding:24px}
.card{background:#fff;border-radius:16px;padding:24px;max-width:500px;margin:0 auto;box-shadow:0 2px 12px rgba(0,0,0,.08)}
h1{font-size:20px;font-weight:800;margin-bottom:8px}
p{font-size:14px;color:#64748b;margin-bottom:20px;line-height:1.5}
button{width:100%;padding:16px;border-radius:12px;background:#16a34a;color:#fff;border:none;font-size:16px;font-weight:700;cursor:pointer;margin-bottom:10px}
button:disabled{opacity:.5;cursor:not-allowed}
.log{background:#f8fafc;border-radius:10px;padding:14px;font-size:13px;color:#334155;line-height:1.8;min-height:80px;margin-top:16px;white-space:pre-wrap}
.ok{color:#16a34a;font-weight:700}
.erro{color:#ef4444;font-weight:700}
</style>
</head>
<body>
<div class="card">
  <h1>Importar Dados para MT6L8G</h1>
  <p>Limpa todos os dados antigos e importa os gastos fixos e parcelados a partir de Setembro 2026.</p>
  <button id="btn" onclick="importar()">Importar dados agora</button>
  <div class="log" id="log">Aguardando...</div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js';
import { getFirestore, doc, updateDoc } from 'https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js';

const firebaseConfig = {
  apiKey: "AIzaSyCJtV0ym0DIAQ1xFcThsvecRolYIhi0OYw",
  authDomain: "gastometro-e0705.firebaseapp.com",
  projectId: "gastometro-e0705",
  storageBucket: "gastometro-e0705.firebasestorage.app",
  messagingSenderId: "138318230251",
  appId: "1:138318230251:web:6066dbc7fb042367d984ae"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

const log = (msg, tipo='') => {
  const el = document.getElementById('log');
  el.innerHTML += `<span class="${tipo}">${msg}</span>\n`;
};

window.importar = async function(){
  const btn = document.getElementById('btn');
  btn.disabled = true;
  document.getElementById('log').innerHTML = '';
  log('Iniciando importação...');

  // Gera ID único
  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,8);

  const fixedExpenses = [
    // GASTOS FIXOS
    {id:'fix_das_cnpj', desc:'Das CNPJ', cat:'outros', val:86.05, parcelado:false},
    {id:'fix_alarme', desc:'Alarme Carro Ubersat', cat:'outros', val:59.90, parcelado:false},
    {id:'fix_contas_casa', desc:'Contas de Casa', cat:'outros', val:100.00, parcelado:false},
    {id:'fix_tiago', desc:'Tiago', cat:'outros', val:100.00, parcelado:false},
    // PARCELADOS FIXOS
    {id:'parc_jo_calcados', desc:'Jo Calçados', cat:'outros', valores:[203.63,203.63,203.63,203.63], parcelado:true, totalParcelas:4, parcelaAtual:1, inicioYM:'2026-09'},
    {id:'parc_uniessa', desc:'Faculdade Uniessa', cat:'outros', valores:[403.29,403.29,403.29,403.29], parcelado:true, totalParcelas:4, parcelaAtual:1, inicioYM:'2026-09'},
    {id:'parc_bv_emp', desc:'Empréstimo BV', cat:'outros', valores:Array(29).fill(1190.13), parcelado:true, totalParcelas:29, parcelaAtual:1, inicioYM:'2026-09'},
    {id:'parc_simplic', desc:'Empréstimo Simplic', cat:'outros', valores:[909.42,909.42,909.42,909.42], parcelado:true, totalParcelas:4, parcelaAtual:1, inicioYM:'2026-09'},
    {id:'parc_picpay', desc:'Picpay Crédito', cat:'outros', valores:[254.61,254.62], parcelado:true, totalParcelas:2, parcelaAtual:1, inicioYM:'2026-09'},
    {id:'parc_supersim', desc:'Super Sim', cat:'outros', valores:[244.84,244.84], parcelado:true, totalParcelas:2, parcelaAtual:1, inicioYM:'2026-09'},
    {id:'parc_nubank_emp', desc:'Empréstimo Nubank', cat:'outros', valores:[337.04,337.04,337.04,337.04], parcelado:true, totalParcelas:4, parcelaAtual:1, inicioYM:'2026-09'},
    // PARCELADOS VARIÁVEIS
    {id:'parc_cred_nubank', desc:'Crédito Nubank', cat:'outros', valores:[406.02,406.02,406.02,406.02,355.59,282.89,188.64,188.64,188.64,188.64], parcelado:true, totalParcelas:10, parcelaAtual:1, inicioYM:'2026-09'},
    {id:'parc_itau1', desc:'Crédito Itaú 1', cat:'outros', valores:[204.87,179.87,179.87,179.87], parcelado:true, totalParcelas:4, parcelaAtual:1, inicioYM:'2026-09'},
    {id:'parc_itau2', desc:'Crédito Itaú 2', cat:'outros', valores:[214.84,214.84,214.84,214.84,214.84,124.84,124.84,41.51,38.33], parcelado:true, totalParcelas:9, parcelaAtual:1, inicioYM:'2026-09'},
    {id:'parc_caixa', desc:'Crédito Caixa', cat:'outros', valores:[113.15,113.15,113.15,98.00,96.25], parcelado:true, totalParcelas:5, parcelaAtual:1, inicioYM:'2026-09'},
    {id:'parc_mercado', desc:'Mercado Pago', cat:'outros', valores:[159.95,142.57,142.57,142.57,142.57,142.57,142.57,142.57], parcelado:true, totalParcelas:8, parcelaAtual:1, inicioYM:'2026-09'},
    {id:'parc_cred_bv', desc:'Crédito BV', cat:'outros', valores:[174.91,174.91,174.91,148.54], parcelado:true, totalParcelas:4, parcelaAtual:1, inicioYM:'2026-09'},
    {id:'parc_inter', desc:'Crédito Inter', cat:'outros', valores:[493.37,493.37,493.37,493.37,310.04,310.04,103.08,72.08,72.08,72.08], parcelado:true, totalParcelas:10, parcelaAtual:1, inicioYM:'2026-09'},
  ];

  // Gerar transações de setembro com IDs únicos
  const transactions = [];
  const dateSet = '2026-09-01';

  fixedExpenses.forEach(fe => {
    if(fe.parcelado){
      transactions.push({
        id: uid(),
        desc: `${fe.desc} (1/${fe.totalParcelas})`,
        cat: 'outros', val: fe.valores[0],
        date: dateSet, paid: false, parceladoId: fe.id
      });
    } else {
      transactions.push({
        id: uid(),
        desc: fe.desc,
        cat: 'outros', val: fe.val,
        date: dateSet, paid: false, fixed: true
      });
    }
  });

  try {
    log(`Salvando ${fixedExpenses.length} gastos fixos/parcelados...`);
    log(`Salvando ${transactions.length} transações de Setembro/2026...`);

    // lastYM = '2026-8' significa que setembro (mês 8 no JS) já foi processado
    // Isso evita que o app crie transações de agosto ao abrir
    await updateDoc(doc(db, 'gastometro_usuarios', 'MT6L8G'), {
      fixedExpenses,
      transactions,
      lastYM: '2026-8',  // setembro em JS (0-indexado)
      renda: 0
    });

    log('✓ Dados importados com sucesso!', 'ok');
    log('✓ lastYM definido como setembro (evita duplicatas)', 'ok');
    log('Abra o app e navegue até Setembro 2026.', 'ok');
    btn.textContent = 'Importado com sucesso!';
  } catch(e) {
    log('Erro: ' + e.message, 'erro');
    btn.disabled = false;
  }
};
</script>
</body>
</html>
